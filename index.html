<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Countries Explorer</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="src/style.css" />
    </head>
    <body>
        <header>
            <div class="header-container">
                <h1>Países del Mundo</h1>
            </div>
        </header>

        <main>
            <!-- SECCIÓN DE FILTROS -->
            <nav id="filters" class="filters-bar">
                <h2>Filtros</h2>
                <div class="filter-group">
                    <label for="region-select">Región:</label>
                    <select id="region-select">
                        <option value="" selected>Todos</option>
                        <option value="africa">África</option>
                        <option value="americas">América</option>
                        <option value="asia">Asia</option>
                        <option value="europe">Europa</option>
                        <option value="oceania">Oceanía</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sort-select">Ordenar por:</label>
                    <select id="sort-select" disabled>
                        <option value="name-asc">Nombre (A-Z)</option>
                        <option value="name-desc">Nombre (Z-A)</option>
                        <option value="pop-desc">Mayor Población</option>
                        <option value="pop-asc">Menor Población</option>
                    </select>
                </div>
                <div class="search-box">
                    <input
                        type="search"
                        placeholder="Buscar país por nombre..."
                        id="countries-search"
                    />
                    <button type="button" id="search-country" class="search-btn">Buscar</button>
                </div>
            </nav>

            <!-- SECCIÓN PRINCIPAL -->
            <h2>Lista de Países</h2>
            <div class="content-layout">
                <!-- Tarjetas -->
                <section class="countries-section">
                    <div class="countries-grid" id="countries">
                        
                    </div>
                </section>

                <!-- Sidebar para el detalle del pais selec -->
                <aside class="country-detail-sidebar hide">
                    <button class="close-btn" id="close-detail">&times;</button>
                    <div class="sidebar-content">
                        <h2>Detalle del País</h2>
                        <img id="detail-flag" alt="Bandera" class="detail-flag" />
                        <h3 id="detail-name"></h3>
                        <p><strong>Nombre oficial:</strong> <span id="detail-official"></span></p>
                        <p><strong>Población:</strong> <span id="detail-population"></span></p>
                        <p><strong>Región:</strong> <span id="detail-region"></span></p>
                        <p><strong>Capital:</strong> <span id="detail-capital"></span></p>
                        <p><strong>Moneda:</strong> <span id="detail-currency"></span></p>
                        <p><strong>Idiomas:</strong> <span id="detail-languages"></span></p>
                        <p><strong>Fronteras:</strong> <span id="detail-borders"></span></p>
                    </div>
                </aside>
            </div>
        </main>

        <footer>
            <p>Derechos reservados FICCT 2-2026</p>
        </footer>

        <script src="src/data.js"></script>
        <script src="src/app.js"></script>
    </body>
</html>
